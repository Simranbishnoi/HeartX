version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: heart_app
      POSTGRES_PASSWORD: heart_password
      POSTGRES_DB: heartdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://heart_app:heart_password@db:5432/heartdb
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
