services:
  - type: web
    name: heartx-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: heartx-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: heartx-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heartx-db
          property: connectionString

databases:
  - name: heartx-db
    databaseName: heartx
    user: heartx_user
