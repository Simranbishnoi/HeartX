services:
  - type: web
    name: heartx-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: heartx-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: heartx-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heartx-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: heartx-db
    databaseName: heartx
    user: heartx_user
